name: Sync and Deploy Kernel Sources

on:
  workflow_dispatch:   # ձեռքով գործարկելու համար
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Create local manifest repository
        run: |
          mkdir manifest-repo
          cd manifest-repo
          cat > default.xml << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
          <remote fetch="https://git.codelinaro.org/clo/la" name="clo" review="codelinaro.org"/>
          <default remote="clo" revision="kernel.build.lnx.1.0" sync-j="8"/>
          <remote fetch="https://github.com/OnePlusOSS" name="origin"/>
          <remote fetch="https://github.com/WildKernels" name="wild"/>
          <project remote="wild" name="AnyKernel3" path="AnyKernel3" revision="d1ebdc2002c557ceff9939afc3098eb88916f464"/>
          <project remote="origin" name="android_kernel_common_oneplus_sm8475" path="kernel_platform/common" revision="oneplus/sm8475_b_16.0.0_oneplus_11r"/>
          <project remote="origin" name="android_kernel_modules_and_devicetree_oneplus_sm8475" path="./" revision="oneplus/sm8475_b_16.0.0_oneplus_11r"/>
          <project remote="clo" name="kernel/prebuilts/build-tools" path="kernel_platform/prebuilts/kernel-build-tools" revision="10ab783184f77d3ea15bf666426a7138b0f62bfc" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
          <project remote="clo" name="kernelplatform/prebuilts-master/clang/host/linux-x86" path="kernel_platform/prebuilts-master/clang/host/linux-x86" revision="0fc3d01a780023469b7acc18c56a9cf5099a6d6c" upstream="refs/heads/ks-kernel.lnx.1.0.r1-rel"/>
          </manifest>
          XML
          git init
          git config user.email "ci@github.actions"
          git config user.name "CI"
          git add default.xml
          git commit -m "Manifest for kernel build"

      - name: Initialize repo with manifest
        run: |
          mkdir -p kernel-sources
          cd kernel-sources
          repo init -u file://$GITHUB_WORKSPACE/manifest-repo -m default.xml --no-repo-verify --depth=1
          repo sync -j$(nproc) --no-clone-bundle
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      # (ըստ ցանկության) Kernel build-ի քայլ. ներկայումս անջատված է
      # - name: Build Kernel
      #   if: false
      #   run: |
      #     cd kernel-sources
      #     bash build/build.sh   # Ձեր build script-ը

      - name: Upload kernel source as artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-source
          path: kernel-sources/
          retention-days: 7
